<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面更新中</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap");
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  html {
    overflow-x: hidden;
  }

  body {
    font-family: "Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #060913;
    color: #e2e8f0;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 背景层：固定定位 + 裁剪，绝不撑开文档宽度 ===== */
  .bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  /* ===== 极光渐变光斑 ===== */
  .aurora {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    will-change: transform;
    pointer-events: none;
  }

  .aurora.a1 {
    width: 62vmax; height: 62vmax;
    top: -28vmax; left: -18vmax;
    background: radial-gradient(circle, rgba(56, 89, 199, 0.55) 0%, transparent 62%);
    -webkit-animation: drift1 22s ease-in-out infinite alternate;
    animation: drift1 22s ease-in-out infinite alternate;
  }

  .aurora.a2 {
    width: 55vmax; height: 55vmax;
    bottom: -26vmax; right: -16vmax;
    background: radial-gradient(circle, rgba(124, 58, 168, 0.42) 0%, transparent 62%);
    -webkit-animation: drift2 26s ease-in-out infinite alternate;
    animation: drift2 26s ease-in-out infinite alternate;
  }

  .aurora.a3 {
    width: 42vmax; height: 42vmax;
    top: 32%; left: 46%;
    background: radial-gradient(circle, rgba(13, 148, 136, 0.30) 0%, transparent 60%);
    -webkit-animation: drift3 30s ease-in-out infinite alternate;
    animation: drift3 30s ease-in-out infinite alternate;
  }

  @-webkit-keyframes drift1 {
    from { -webkit-transform: translate3d(0, 0, 0) scale(1); }
    to   { -webkit-transform: translate3d(9vmax, 6vmax, 0) scale(1.18); }
  }
  @keyframes drift1 {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(9vmax, 6vmax, 0) scale(1.18); }
  }
  @-webkit-keyframes drift2 {
    from { -webkit-transform: translate3d(0, 0, 0) scale(1.1); }
    to   { -webkit-transform: translate3d(-8vmax, -5vmax, 0) scale(0.95); }
  }
  @keyframes drift2 {
    from { transform: translate3d(0, 0, 0) scale(1.1); }
    to   { transform: translate3d(-8vmax, -5vmax, 0) scale(0.95); }
  }
  @-webkit-keyframes drift3 {
    from { -webkit-transform: translate3d(0, 0, 0) scale(0.9) rotate(0deg); }
    to   { -webkit-transform: translate3d(-10vmax, 5vmax, 0) scale(1.15) rotate(40deg); }
  }
  @keyframes drift3 {
    from { transform: translate3d(0, 0, 0) scale(0.9) rotate(0deg); }
    to   { transform: translate3d(-10vmax, 5vmax, 0) scale(1.15) rotate(40deg); }
  }

  /* 暗角，让中心更聚焦 */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 46%, transparent 34%, rgba(3, 5, 12, 0.78) 100%);
    pointer-events: none;
  }

  /* 星光粒子（闪烁） */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #cbd5e1;
    will-change: opacity, transform;
    -webkit-animation: twinkle ease-in-out infinite;
    animation: twinkle ease-in-out infinite;
    pointer-events: none;
  }

  @-webkit-keyframes twinkle {
    0%, 100% { opacity: 0.08; -webkit-transform: scale(0.7); }
    50%      { opacity: 0.85; -webkit-transform: scale(1.15); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.08; transform: scale(0.7); }
    50%      { opacity: 0.85; transform: scale(1.15); }
  }

  /* 主内容 */
  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 28px;
    max-width: 640px;
    width: 100%;
    margin: auto;
  }

  /* ===== 图标动画：脉冲核心 + 双层轨道 ===== */
  .icon-wrap {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 38px;
  }

  .orbit {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(148, 163, 184, 0.22);
    will-change: transform;
  }

  .orbit::before {
    content: "";
    position: absolute;
    top: -4px;
    left: 50%;
    width: 8px;
    height: 8px;
    margin-left: -4px;
    border-radius: 50%;
    background: #7dd3fc;
    box-shadow: 0 0 12px 2px rgba(125, 211, 252, 0.8);
  }

  .orbit.o1 {
    -webkit-animation: spin 3.6s linear infinite;
    animation: spin 3.6s linear infinite;
  }

  .orbit.o2 {
    inset: 16px;
    border-style: dashed;
    border-color: rgba(196, 181, 253, 0.35);
    -webkit-animation: spinRev 5.4s linear infinite;
    animation: spinRev 5.4s linear infinite;
  }

  .orbit.o2::before {
    width: 6px;
    height: 6px;
    margin-left: -3px;
    background: #c4b5fd;
    box-shadow: 0 0 10px 2px rgba(196, 181, 253, 0.8);
  }

  /* 发光核心 */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 46px;
    height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #a5f3fc 0%, #38bdf8 42%, #1d4ed8 100%);
    box-shadow:
      0 0 22px 4px rgba(56, 189, 248, 0.45),
      0 0 60px 12px rgba(59, 130, 246, 0.25);
    will-change: transform, box-shadow;
    -webkit-animation: pulse 2.1s ease-in-out infinite;
    animation: pulse 2.1s ease-in-out infinite;
  }

  @-webkit-keyframes pulse {
    0%, 100% {
      -webkit-transform: scale(1);
      box-shadow: 0 0 22px 4px rgba(56, 189, 248, 0.45), 0 0 60px 12px rgba(59, 130, 246, 0.25);
    }
    50% {
      -webkit-transform: scale(1.14);
      box-shadow: 0 0 32px 8px rgba(56, 189, 248, 0.65), 0 0 84px 20px rgba(99, 102, 241, 0.35);
    }
  }
  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 22px 4px rgba(56, 189, 248, 0.45), 0 0 60px 12px rgba(59, 130, 246, 0.25);
    }
    50% {
      transform: scale(1.14);
      box-shadow: 0 0 32px 8px rgba(56, 189, 248, 0.65), 0 0 84px 20px rgba(99, 102, 241, 0.35);
    }
  }

  /* 扩散波纹 */
  .ripple {
    position: absolute;
    inset: 34px;
    border-radius: 50%;
    border: 1px solid rgba(125, 211, 252, 0.5);
    will-change: transform, opacity;
    -webkit-animation: ripple 2.1s ease-out infinite;
    animation: ripple 2.1s ease-out infinite;
  }

  .ripple.r2 {
    -webkit-animation-delay: 1.05s;
    animation-delay: 1.05s;
  }

  @-webkit-keyframes ripple {
    0%   { -webkit-transform: scale(0.55); opacity: 0.85; }
    100% { -webkit-transform: scale(1.85); opacity: 0; }
  }
  @keyframes ripple {
    0%   { transform: scale(0.55); opacity: 0.85; }
    100% { transform: scale(1.85); opacity: 0; }
  }

  @-webkit-keyframes spin {
    from { -webkit-transform: rotate(0deg); }
    to   { -webkit-transform: rotate(360deg); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @-webkit-keyframes spinRev {
    from { -webkit-transform: rotate(360deg); }
    to   { -webkit-transform: rotate(0deg); }
  }
  @keyframes spinRev {
    from { transform: rotate(360deg); }
    to   { transform: rotate(0deg); }
  }

  /* 标题（文字不变） */
  h1 {
    font-size: clamp(32px, 7.5vw, 50px);
    font-weight: 600;
    letter-spacing: 2px;
    line-height: 1.5;
    color: #f1f5f9;
    text-shadow: 0 0 34px rgba(125, 211, 252, 0.35);
  }

  /* 进度条：扫光效果 */
  .progress {
    margin: 42px auto 0;
    width: min(320px, 78%);
    height: 4px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.16);
    overflow: hidden;
    position: relative;
  }

  .progress span {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 42%;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #38bdf8 30%, #a5f3fc 50%, #38bdf8 70%, transparent);
    will-change: transform;
    -webkit-animation: sweep 1.9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    animation: sweep 1.9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @-webkit-keyframes sweep {
    from { -webkit-transform: translate3d(-110%, 0, 0); }
    to   { -webkit-transform: translate3d(260%, 0, 0); }
  }
  @keyframes sweep {
    from { transform: translate3d(-110%, 0, 0); }
    to   { transform: translate3d(260%, 0, 0); }
  }

  /* 三个跳动点 */
  .loading-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 26px;
  }

  .loading-dots i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7dd3fc;
    will-change: transform, opacity;
    -webkit-animation: bounce 1.4s ease-in-out infinite;
    animation: bounce 1.4s ease-in-out infinite;
  }

  .loading-dots i:nth-child(2) { -webkit-animation-delay: 0.18s; animation-delay: 0.18s; background: #a5b4fc; }
  .loading-dots i:nth-child(3) { -webkit-animation-delay: 0.36s; animation-delay: 0.36s; background: #c4b5fd; }

  @-webkit-keyframes bounce {
    0%, 80%, 100% { -webkit-transform: translate3d(0, 0, 0); opacity: 0.45; }
    40%           { -webkit-transform: translate3d(0, -9px, 0); opacity: 1; }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: translate3d(0, 0, 0); opacity: 0.45; }
    40%           { transform: translate3d(0, -9px, 0); opacity: 1; }
  }

  /* 底部提示 */
  .footer-note {
    margin-top: 50px;
    font-size: 17px;
    letter-spacing: 1px;
    color: rgba(148, 163, 184, 0.55);
  }

  @media (max-width: 480px) {
    .icon-wrap { width: 106px; height: 106px; margin-bottom: 30px; }
    .core { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
    .ripple { inset: 27px; }
  }
</style>
</head>
<body>

  <div class="bg">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="vignette"></div>
  </div>

  <main class="container">
    <div class="icon-wrap">
      <div class="orbit o1"></div>
      <div class="orbit o2"></div>
      <div class="ripple"></div>
      <div class="ripple r2"></div>
      <div class="core"></div>
    </div>

    <h1>页面更新中</h1>

    <div class="progress"><span></span></div>
    <div class="loading-dots"><i></i><i></i><i></i></div>

    <div class="footer-note"><a href="https://www.xjmep.com" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">www.xjmep.com</a></div>
  </main>

  <script>
    // 生成闪烁星光（挂到背景层，避免撑开页面）
    (function createStars() {
      const count = window.innerWidth < 600 ? 28 : 52;
      const frag = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const star = document.createElement('span');
        const size = Math.random() * 2 + 1;

        star.className = 'star';
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
        star.style.webkitAnimationDuration = star.style.animationDuration;
        star.style.animationDelay = (Math.random() * 4) + 's';
        star.style.webkitAnimationDelay = star.style.animationDelay;

        frag.appendChild(star);
      }
      document.querySelector('.bg').appendChild(frag);
    })();
  </script>

</body>
</html>
