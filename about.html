<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面更新中</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap");
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Source Han Sans SC", "思源黑体", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    background: #0f172a;
    color: #e2e8f0;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  /* 网格纹理 */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 78%);
    pointer-events: none;
  }

  /* 漂浮的小圆点 */
  .dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    opacity: 0;
    will-change: transform, opacity;
    -webkit-animation: rise linear infinite;
    animation: rise linear infinite;
  }

  @-webkit-keyframes rise {
    0%   { -webkit-transform: translate3d(0, 0, 0) scale(0.5); opacity: 0; }
    15%  { opacity: 0.8; }
    85%  { opacity: 0.5; }
    100% { -webkit-transform: translate3d(0, -110vh, 0) scale(1.2); opacity: 0; }
  }

  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) scale(0.5); opacity: 0; }
    15%  { opacity: 0.8; }
    85%  { opacity: 0.5; }
    100% { transform: translate3d(0, -110vh, 0) scale(1.2); opacity: 0; }
  }

  /* 主内容 */
  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 28px;
    max-width: 640px;
    width: 100%;
  }

  /* 齿轮图标 */
  .icon-wrap {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 38px;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(129, 140, 248, 0.55);
    will-change: transform;
    -webkit-animation: spin 12s linear infinite;
    animation: spin 12s linear infinite;
  }

  .ring.inner {
    inset: 22px;
    border-style: solid;
    border-color: rgba(236, 72, 153, 0.35);
    border-top-color: rgba(236, 72, 153, 0.9);
    -webkit-animation: spin 2.4s linear infinite reverse;
    animation: spin 2.4s linear infinite reverse;
  }

  /* 关键修复：显式 from/to，函数列表保持一致 */
  @-webkit-keyframes spin {
    from { -webkit-transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { -webkit-transform: translate3d(0, 0, 0) rotate(360deg); }
  }

  @keyframes spin {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { transform: translate3d(0, 0, 0) rotate(360deg); }
  }

  .gear {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
    color: #a5b4fc;
    will-change: transform;
    -webkit-animation: spin 6s linear infinite;
    animation: spin 6s linear infinite;
  }

  .gear svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 标题（纯色） */
  h1 {
    font-size: clamp(32px, 7.5vw, 50px);
    font-weight: 600;
    letter-spacing: 2px;
    line-height: 1.5;
    color: #e2e8f0;
  }

  /* 副标题 */
  p.sub {
    margin-top: 18px;
    font-size: clamp(16px, 4.2vw, 20px);
    color: #94a3b8;
    letter-spacing: 1.5px;
    line-height: 1.9;
  }

  /* 进度条（纯色 + transform 动画） */
  .progress {
    margin: 42px auto 0;
    width: min(320px, 78%);
    height: 4px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.18);
    overflow: hidden;
    position: relative;
  }

  .progress span {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: #818cf8;
    transform-origin: left center;
    will-change: transform;
    -webkit-animation: slideTransform 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    animation: slideTransform 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  @-webkit-keyframes slideTransform {
    0%   { -webkit-transform: translate3d(-100%, 0, 0) scaleX(0.4); }
    50%  { -webkit-transform: translate3d(30%, 0, 0) scaleX(0.55); }
    100% { -webkit-transform: translate3d(100%, 0, 0) scaleX(0.4); }
  }

  @keyframes slideTransform {
    0%   { transform: translate3d(-100%, 0, 0) scaleX(0.4); }
    50%  { transform: translate3d(30%, 0, 0) scaleX(0.55); }
    100% { transform: translate3d(100%, 0, 0) scaleX(0.4); }
  }

  /* 三个跳动点 */
  .loading-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 26px;
  }

  .loading-dots i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #818cf8;
    will-change: transform, opacity;
    -webkit-animation: bounce 1.4s ease-in-out infinite;
    animation: bounce 1.4s ease-in-out infinite;
  }

  .loading-dots i:nth-child(2) { -webkit-animation-delay: 0.18s; animation-delay: 0.18s; background: #c084fc; }
  .loading-dots i:nth-child(3) { -webkit-animation-delay: 0.36s; animation-delay: 0.36s; background: #f472b6; }

  @-webkit-keyframes bounce {
    0%, 80%, 100% { -webkit-transform: translate3d(0, 0, 0); opacity: 0.45; }
    40%           { -webkit-transform: translate3d(0, -9px, 0); opacity: 1; }
  }

  @keyframes bounce {
    0%, 80%, 100% { transform: translate3d(0, 0, 0); opacity: 0.45; }
    40%           { transform: translate3d(0, -9px, 0); opacity: 1; }
  }

  /* 底部提示 */
  .footer-note {
    margin-top: 50px;
    font-size: 17px;
    letter-spacing: 1px;
    color: rgba(148, 163, 184, 0.55);
  }

  @media (max-width: 480px) {
    .icon-wrap { width: 104px; height: 104px; margin-bottom: 30px; }
    .gear { width: 42px; height: 42px; margin: -21px 0 0 -21px; }
  }
</style>
</head>
<body>

  <div class="grid-overlay"></div>

  <main class="container">
    <div class="icon-wrap">
      <div class="ring"></div>
      <div class="ring inner"></div>
      <div class="gear">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
          <path d="M21.7 13.35l-1.63-.94a7.9 7.9 0 0 0 0-1.82l1.63-.94a.75.75 0 0 0 .27-1.02l-1.5-2.6a.75.75 0 0 0-1.02-.27l-1.63.94a7.9 7.9 0 0 0-1.58-.91V3.75a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75v1.88a7.9 7.9 0 0 0-1.58.91L8.53 5.6a.75.75 0 0 0-1.02.27l-1.5 2.6a.75.75 0 0 0 .27 1.02l1.63.94a7.9 7.9 0 0 0 0 1.82l-1.63.94a.75.75 0 0 0-.27 1.02l1.5 2.6a.75.75 0 0 0 1.02.27l1.63-.94c.48.38 1.01.68 1.58.91v1.88c0 .41.34.75.75.75h3c.41 0 .75-.34.75-.75v-1.88a7.9 7.9 0 0 0 1.58-.91l1.63.94a.75.75 0 0 0 1.02-.27l1.5-2.6a.75.75 0 0 0-.27-1.02Z" opacity=".55"/>
        </svg>
      </div>
    </div>

    <h1>页面更新中</h1>

    <div class="progress"><span></span></div>
    <div class="loading-dots"><i></i><i></i><i></i></div>

    <div class="footer-note"><a href="https://www.xjmep.com" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">www.xjmep.com</a></div>
  </main>

  <script>
    // 生成漂浮粒子
    (function createDots() {
      const count = window.innerWidth < 600 ? 14 : 26;
      const frag = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const dot = document.createElement('span');
        const size = Math.random() * 3.5 + 1.5;

        dot.className = 'dot';
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.bottom = '-10px';
        dot.style.animationDuration = (Math.random() * 9 + 9) + 's';
        dot.style.webkitAnimationDuration = dot.style.animationDuration;
        dot.style.animationDelay = (Math.random() * 12) + 's';
        dot.style.webkitAnimationDelay = dot.style.animationDelay;
        dot.style.opacity = Math.random() * 0.5 + 0.2;

        frag.appendChild(dot);
      }
      document.body.appendChild(frag);
    })();
  </script>

</body>
</html>
